name: ea-computers

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ea_computers
    ports:
      - '5433:5432'
    volumes:
      - ea_computers_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ea_computers_redis_data:/data

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ea_computers?schema=public
      PORT: 4000
      NODE_ENV: production
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
      JWT_EXPIRES_IN: 7d
      CART_COOKIE_NAME: ea_cart_sid
      CART_COOKIE_SECRET: ${CART_COOKIE_SECRET:-change-me-too-another-long-random-string}
      STORAGE_PROVIDER: local
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    volumes:
      - ea_computers_uploads:/app/uploads

  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - '3001:80'

volumes:
  ea_computers_postgres_data:
  ea_computers_redis_data:
  ea_computers_uploads:
